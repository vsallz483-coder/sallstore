<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>SALL STORE — Top Up & Voucher</title>
  <meta name="theme-color" content="#0b1120" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #0b1120;
      --bg-secondary: #111d2e;
      --bg-glass: rgba(255,255,255,0.04);
      --border-glass: rgba(255,255,255,0.08);
      --text-primary: #f0f6ff;
      --text-secondary: #94b0d4;
      --text-muted: #6a7f9f;
      --accent-grad: linear-gradient(135deg, #ffffff 0%, #7cb9ff 50%, #4f8cf7 100%);
      --shadow-soft: 0 8px 32px rgba(0,0,0,0.5);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --success: #34d399;
      --danger: #f87171;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(79,140,247,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(124,108,240,0.08) 0%, transparent 60%);
      background-attachment: fixed;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #7cb9ff; border-radius: 10px; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes fadeScale {
      from { opacity:0; transform:scale(0.94); }
      to   { opacity:1; transform:scale(1); }
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes toastPop {
      0%   { opacity:0; transform:translateY(30px) scale(0.92); }
      60%  { opacity:1; transform:translateY(-4px) scale(1.02); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes splashLoad {
      0% { width:0%; }
      50% { width:65%; }
      85% { width:90%; }
      100% { width:100%; }
    }
    .fade-in { animation: fadeUp 0.6s var(--ease-smooth) forwards; }
    .fade-scale { animation: fadeScale 0.5s var(--ease-smooth) forwards; }
    .delay-1 { animation-delay:0.05s; opacity:0; }
    .delay-2 { animation-delay:0.10s; opacity:0; }
    .delay-3 { animation-delay:0.15s; opacity:0; }
    .delay-4 { animation-delay:0.20s; opacity:0; }

    /* SPLASH */
    .splash-overlay {
      position:fixed; inset:0; z-index:9999;
      background:var(--bg-primary);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition: opacity 0.7s var(--ease-smooth), transform 0.7s var(--ease-smooth);
      pointer-events:none;
    }
    .splash-overlay.hide { opacity:0; transform:scale(1.06); pointer-events:none; }
    .splash-overlay .splash-logo {
      width:80px; height:80px; border-radius:20px;
      background:var(--bg-secondary); object-fit:cover;
      box-shadow: 0 8px 40px rgba(79,140,247,0.2);
      margin-bottom:16px;
    }
    .splash-overlay .splash-title {
      font-size:1.8rem; font-weight:800;
      background:var(--accent-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      letter-spacing:-0.5px; margin-bottom:4px;
    }
    .splash-overlay .splash-sub {
      font-size:0.8rem; color:var(--text-muted);
      letter-spacing:2px; font-weight:500; opacity:0.6;
    }
    .splash-overlay .splash-loader {
      margin-top:28px; width:200px; max-width:70%; height:4px;
      background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden;
    }
    .splash-overlay .splash-loader .bar {
      height:100%; width:0%;
      background:var(--accent-grad); border-radius:4px;
      animation: splashLoad 3s var(--ease-smooth) forwards;
    }

    /* APP */
    .app-wrapper {
      width:100%; max-width:500px; margin:0 auto;
      animation: fadeScale 0.6s var(--ease-smooth);
    }
    .glass {
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: background 0.3s, border 0.3s;
    }

    /* HEADER */
    .header {
      display: flex; justify-content:space-between; align-items:center;
      padding:16px 20px 12px; border-bottom:1px solid var(--border-glass);
    }
    .header-brand { display:flex; align-items:center; gap:10px; }
    .header-brand .logo-img {
      width:38px; height:38px; border-radius:var(--radius-sm);
      object-fit:cover; background:var(--bg-secondary);
      box-shadow: 0 4px 16px rgba(79,140,247,0.3);
    }
    .header-brand h1 {
      font-size:1.4rem; font-weight:800;
      background:var(--accent-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      letter-spacing:-0.5px;
    }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .user-badge {
      background:rgba(255,255,255,0.06); padding:6px 14px; border-radius:30px;
      font-size:0.72rem; font-weight:600; color:#7cb9ff;
      border:1px solid rgba(255,255,255,0.1);
      display:flex; align-items:center; gap:6px;
      cursor:pointer; transition: all 0.25s var(--ease-smooth);
    }
    .user-badge:hover { background:rgba(255,255,255,0.12); transform:scale(1.02); }
    .btn-icon {
      background:transparent; border:none; color:var(--text-secondary);
      font-size:1.1rem; cursor:pointer; padding:6px;
      border-radius:50%; transition: all 0.25s var(--ease-smooth);
      width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    }
    .btn-icon:hover { background:rgba(255,255,255,0.06); color:#fff; transform:scale(1.08); }

    /* SALDO CARD */
    .saldo-card {
      margin:14px 16px 16px; padding:18px 20px;
      background:linear-gradient(145deg, rgba(255,255,255,0.04), rgba(79,140,247,0.04));
      border-radius:var(--radius-md);
      border:1px solid rgba(255,255,255,0.06);
      position:relative; overflow:hidden;
      transition: transform 0.3s var(--ease-smooth);
    }
    .saldo-card:hover { transform:translateY(-2px); }
    .saldo-card::after {
      content:''; position:absolute; top:-50%; right:-30%;
      width:200px; height:200px;
      background:radial-gradient(circle, rgba(79,140,247,0.06), transparent 70%);
      border-radius:50%; pointer-events:none;
    }
    .saldo-label {
      font-size:0.7rem; font-weight:600; text-transform:uppercase;
      letter-spacing:0.5px; color:var(--text-secondary);
      display:flex; align-items:center; gap:6px;
    }
    .saldo-amount {
      font-size:2rem; font-weight:800; color:#fff;
      margin:2px 0 8px; letter-spacing:-0.5px;
    }
    .saldo-amount span {
      background:var(--accent-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .saldo-bar {
      width:100%; height:4px; background:rgba(255,255,255,0.06);
      border-radius:8px; overflow:hidden; margin-bottom:10px;
    }
    .saldo-bar .fill {
      height:100%; width:0%;
      background:var(--accent-grad);
      border-radius:8px;
      transition: width 0.8s var(--ease-smooth);
    }
    .saldo-actions { display:flex; gap:8px; }
    .saldo-actions button {
      flex:1; padding:8px 12px; border:none; border-radius:var(--radius-sm);
      font-weight:700; font-size:0.8rem; cursor:pointer;
      transition: all 0.25s var(--ease-smooth);
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-family:inherit;
    }
    .btn-topup {
      background:var(--accent-grad); color:#0b1120;
      box-shadow:0 4px 16px rgba(79,140,247,0.2);
    }
    .btn-topup:hover { transform:translateY(-2px) scale(1.01); box-shadow:0 8px 28px rgba(79,140,247,0.3); }
    .btn-history {
      background:rgba(255,255,255,0.05); color:var(--text-secondary);
      border:1px solid var(--border-glass);
    }
    .btn-history:hover { background:rgba(255,255,255,0.08); color:#fff; transform:translateY(-2px); }

    /* STATS ROW */
    .stats-row {
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
      padding:0 16px 14px;
    }
    .stat-item {
      background:var(--bg-glass); border:1px solid var(--border-glass);
      border-radius:var(--radius-sm); padding:10px 8px;
      text-align:center; transition: all 0.3s var(--ease-smooth);
    }
    .stat-item:hover { transform:translateY(-2px); border-color:rgba(255,255,255,0.15); }
    .stat-item .num { font-size:1.1rem; font-weight:800; color:var(--text-primary); }
    .stat-item .lbl { font-size:0.6rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; margin-top:2px; }
    .stat-item .num.green { color:var(--success); }
    .stat-item .num.orange { color:#fbbf24; }
    .stat-item .num.blue {
      background:var(--accent-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }

    .points-badge {
      background:rgba(255,215,0,0.15);
      border:1px solid rgba(255,215,0,0.2);
      color:#fbbf24;
      padding:2px 12px;
      border-radius:30px;
      font-size:0.65rem;
      font-weight:700;
    }
    .coupon-badge {
      display:inline-block;
      background:var(--accent-grad);
      color:#0b1120;
      font-weight:700;
      padding:2px 12px;
      border-radius:30px;
      font-size:0.65rem;
    }

    /* NAV TABS */
    .nav-tabs {
      display:flex; gap:4px; padding:0 14px 12px;
      overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none;
    }
    .nav-tabs::-webkit-scrollbar { display:none; }
    .nav-tab {
      flex-shrink:0; padding:8px 14px; background:transparent; border:none;
      border-radius:30px; color:var(--text-muted); font-weight:600; font-size:0.75rem;
      cursor:pointer; transition: all 0.3s var(--ease-smooth);
      white-space:nowrap; font-family:inherit;
    }
    .nav-tab:hover { color:var(--text-secondary); background:rgba(255,255,255,0.04); transform:scale(1.02); }
    .nav-tab.active {
      background:var(--accent-grad); color:#0b1120;
      box-shadow:0 4px 16px rgba(79,140,247,0.2);
      transform:scale(1.02);
    }
    .nav-tab i { margin-right:5px; }

    /* TAB CONTENT */
    .tab-content { display:none; padding:0 14px 16px; animation: fadeUp 0.4s var(--ease-smooth); }
    .tab-content.active { display:block; }

    /* SUB TABS */
    .sub-tabs {
      display:flex; gap:4px; margin-bottom:14px;
      overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none;
    }
    .sub-tabs::-webkit-scrollbar { display:none; }
    .sub-tab {
      flex-shrink:0; padding:6px 14px;
      background:rgba(255,255,255,0.04); border:1px solid var(--border-glass);
      border-radius:30px; color:var(--text-muted); font-weight:600; font-size:0.7rem;
      cursor:pointer; transition: all 0.3s var(--ease-smooth);
      white-space:nowrap; font-family:inherit;
    }
    .sub-tab:hover { color:var(--text-secondary); background:rgba(255,255,255,0.06); transform:scale(1.02); }
    .sub-tab.active {
      background:var(--accent-grad); color:#0b1120; border-color:transparent;
      box-shadow:0 4px 12px rgba(79,140,247,0.15);
      transform:scale(1.02);
    }
    .sub-tab i { margin-right:4px; }
    .sub-content { display:none; animation: fadeUp 0.35s var(--ease-smooth); }
    .sub-content.active { display:block; }

    /* FORM */
    .form-group { margin-bottom:14px; }
    .form-group label {
      display:block; font-size:0.75rem; font-weight:600;
      color:var(--text-secondary); margin-bottom:5px; letter-spacing:0.3px;
    }
    .form-group label i {
      margin-right:5px;
      background:var(--accent-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:10px 14px;
      background:rgba(0,0,0,0.25); border:1px solid var(--border-glass);
      border-radius:var(--radius-sm); color:var(--text-primary);
      font-size:0.9rem; font-family:inherit; outline:none;
      transition: border 0.25s var(--ease-smooth), box-shadow 0.25s var(--ease-smooth);
      resize:vertical;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:#7cb9ff;
      box-shadow:0 0 0 3px rgba(79,140,247,0.12);
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color:var(--text-muted); }
    .form-group select option { background:var(--bg-secondary); }
    .error-text { color:var(--danger); font-size:0.7rem; margin-top:3px; display:none; }

    /* PRICE GRID */
    .price-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:6px;
    }
    .price-tag {
      padding:8px 4px; background:rgba(255,255,255,0.03);
      border:1px solid var(--border-glass); border-radius:var(--radius-sm);
      text-align:center; font-size:0.75rem; font-weight:600;
      color:var(--text-secondary); cursor:pointer;
      transition: all 0.25s var(--ease-smooth);
      user-select:none;
    }
    .price-tag:hover { border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); transform:scale(1.02); }
    .price-tag.active {
      border-color:#7cb9ff; background:rgba(79,140,247,0.12);
      color:#fff; box-shadow:0 0 20px rgba(79,140,247,0.08);
      transform:scale(1.04);
    }

    /* BUTTONS */
    .btn-primary {
      width:100%; padding:12px; background:var(--accent-grad);
      border:none; border-radius:var(--radius-sm); color:#0b1120;
      font-weight:700; font-size:0.95rem; cursor:pointer;
      transition: all 0.3s var(--ease-smooth);
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-family:inherit; position:relative; overflow:hidden;
    }
    .btn-primary:hover:not(:disabled) { transform:translateY(-2px) scale(1.01); box-shadow:0 8px 28px rgba(79,140,247,0.25); }
    .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .btn-primary .spinner {
      display:none; width:18px; height:18px;
      border:2px solid rgba(0,0,0,0.1); border-top-color:#0b1120;
      border-radius:50%; animation:spin 0.8s linear infinite;
    }
    .btn-primary .loading-text {
      display:none; font-weight:600; font-size:0.95rem;
    }
    .btn-primary.loading .btn-text { display:none; }
    .btn-primary.loading .spinner { display:inline-block; }
    .btn-primary.loading .loading-text { display:inline-block; }

    /* HISTORY */
    .filter-bar {
      display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;
    }
    .filter-bar input, .filter-bar select {
      flex:1; min-width:60px; padding:6px 12px;
      background:rgba(0,0,0,0.25); border:1px solid var(--border-glass);
      border-radius:var(--radius-sm); color:var(--text-primary);
      font-size:0.75rem; font-family:inherit; outline:none;
      transition: border 0.25s var(--ease-smooth);
    }
    .filter-bar input:focus, .filter-bar select:focus { border-color:#7cb9ff; }
    .filter-bar .btn-filter {
      padding:6px 12px; background:rgba(255,255,255,0.04);
      border:1px solid var(--border-glass); border-radius:var(--radius-sm);
      color:var(--text-secondary); cursor:pointer; font-weight:600; font-size:0.75rem;
      transition: all 0.25s var(--ease-smooth); font-family:inherit;
    }
    .filter-bar .btn-filter:hover { background:rgba(255,255,255,0.07); color:#fff; transform:scale(1.04); }
    .filter-bar .btn-filter.danger { color:var(--danger); border-color:rgba(248,113,113,0.15); }
    .filter-bar .btn-filter.danger:hover { background:rgba(248,113,113,0.08); }

    .history-list {
      max-height:340px; overflow-y:auto; padding-right:4px;
    }
    .history-list::-webkit-scrollbar { width:4px; }
    .history-list::-webkit-scrollbar-thumb { background:#7cb9ff; border-radius:8px; }

    .history-item {
      background:rgba(255,255,255,0.02); border:1px solid var(--border-glass);
      border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px;
      cursor:pointer; transition: all 0.25s var(--ease-smooth);
      border-left:3px solid #7cb9ff;
    }
    .history-item:hover { background:rgba(255,255,255,0.04); transform:translateX(4px); }
    .history-item .hdr { display:flex; justify-content:space-between; align-items:center; }
    .history-item .hdr strong { font-size:0.9rem; }
    .history-item .hdr .badge-status {
      font-size:0.6rem; font-weight:700; padding:2px 10px; border-radius:30px;
      background:rgba(16,185,129,0.12); color:var(--success);
      border:1px solid rgba(16,185,129,0.15);
    }
    .history-item .meta {
      font-size:0.7rem; color:var(--text-muted); margin-top:4px;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .history-item .meta span { display:flex; align-items:center; gap:3px; }
    .empty-state { text-align:center; padding:30px 0; color:var(--text-muted); }
    .empty-state i { font-size:2.2rem; display:block; margin-bottom:10px; opacity:0.4; }

    /* MODALS */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px); z-index:2000;
      align-items:center; justify-content:center; padding:20px;
      animation: fadeScale 0.3s var(--ease-smooth);
    }
    .modal-overlay.show { display:flex; }
    .modal-box {
      background:var(--bg-secondary); border:1px solid var(--border-glass);
      border-radius:var(--radius-lg); padding:24px 20px;
      max-width:400px; width:100%;
      animation: fadeScale 0.35s var(--ease-smooth);
      box-shadow:var(--shadow-soft); max-height:90vh; overflow-y:auto;
    }
    .modal-box h2 {
      font-size:1.3rem; font-weight:800; text-align:center; margin-bottom:4px;
      background:var(--accent-grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .modal-box .sub { text-align:center; color:var(--text-secondary); font-size:0.8rem; margin-bottom:16px; }
    .modal-box .qris-placeholder {
      background:rgba(255,255,255,0.05); border-radius:var(--radius-sm);
      padding:16px; margin:8px 0 14px; text-align:center;
      display:flex; justify-content:center;
    }
    .modal-box .qris-placeholder #qrcode {
      background:#fff;
      padding:12px;
      border-radius:12px;
      display:inline-block;
    }
    .modal-actions { display:flex; gap:10px; margin-top:14px; }
    .modal-actions button {
      flex:1; padding:10px; border:none; border-radius:var(--radius-sm);
      font-weight:700; font-size:0.85rem; cursor:pointer;
      transition: all 0.25s var(--ease-smooth); font-family:inherit;
    }
    .modal-actions .btn-cancel {
      background:rgba(255,255,255,0.05); color:var(--text-secondary);
      border:1px solid var(--border-glass);
    }
    .modal-actions .btn-cancel:hover { background:rgba(255,255,255,0.08); transform:scale(1.02); }
    .modal-actions .btn-confirm {
      background:var(--accent-grad); color:#0b1120;
      box-shadow:0 4px 16px rgba(79,140,247,0.15); position:relative;
    }
    .modal-actions .btn-confirm:hover { transform:translateY(-2px) scale(1.01); box-shadow:0 8px 28px rgba(79,140,247,0.25); }
    .modal-actions .btn-confirm .spinner {
